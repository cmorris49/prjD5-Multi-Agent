<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="site-header">
        <div>
            <h1 data-i18n="user.heading"></h1>
            <p id="userEmail" class="account-email"></p>
        </div>

        <button id="logoutButton" class="secondary-button" data-i18n="common.logout"></button>
    </header>

    <main class="page-container">
        <section aria-labelledby="promptHeading">
            <h2 id="promptHeading" data-i18n="user.promptHeading"></h2>

            <form id="promptForm">
                <div class="form-field">
                    <label for="responseMode" data-i18n="user.modeLabel"></label>
                    <select id="responseMode" name="mode">
                        <option value="consensus" data-i18n="user.consensusMode"></option>
                        <option value="single" data-i18n="user.singleMode"></option>
                    </select>
                </div>

                <div id="agentField" class="form-field">
                    <label for="agent" data-i18n="user.agentLabel"></label>
                    <select id="agent" name="agent">
                        <option value="optimist" data-i18n="agents.optimist.role"></option>
                        <option value="skeptic" data-i18n="agents.skeptic.role"></option>
                        <option value="logical_analyst" data-i18n="agents.logical_analyst.role"></option>
                        <option value="creative_thinker" data-i18n="agents.creative_thinker.role"></option>
                        <option value="pragmatist" data-i18n="agents.pragmatist.role"></option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="prompt" data-i18n="user.promptLabel"></label>
                    <textarea
                        id="prompt"
                        name="prompt"
                        rows="5"
                        maxlength="2000"
                        required
                        data-i18n-placeholder="user.promptPlaceholder"
                    ></textarea>
                </div>

                <button type="submit" data-i18n="user.submitButton"></button>
            </form>
        </section>

        <section class="results-section" aria-labelledby="resultsHeading">
            <h2 id="resultsHeading" data-i18n="user.resultsHeading"></h2>
            <div id="results" class="provider-results" aria-live="polite"></div>
            <p id="consensusResult" class="form-message" aria-live="polite"></p>
        </section>

        <p id="pageMessage" class="form-message" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./scripts/pages/userPage.js"></script>
</body>
</html>
