<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="auth-page">
    <main class="auth-container">
        <h1 data-i18n="login.heading"></h1>

        <form id="loginForm" novalidate>
            <div class="form-field">
                <label for="email" data-i18n="forms.emailLabel"></label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <div class="form-field">
                <label for="password" data-i18n="forms.passwordLabel"></label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="72"
                    required
                >
            </div>

            <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>

            <button id="submitButton" type="submit" data-i18n="login.submitButton"></button>
        </form>

        <p class="auth-link">
            <span data-i18n="login.registrationPrompt"></span>
            <a href="./register.html" data-i18n="login.registrationLink"></a>
        </p>
    </main>

    <script type="module" src="./scripts/pages/loginPage.js"></script>
</body>
</html>
