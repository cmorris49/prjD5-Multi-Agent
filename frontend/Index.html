<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <h1 data-i18n="heading"></h1>

    <form id="promptForm">
        <label for="prompt" data-i18n="promptLabel"></label>

        <div>
            <textarea
                id="prompt"
                rows="5"
                cols="60"
                maxlength="2000"
                required
            ></textarea>
        </div>

        <button type="submit" data-i18n="submitButton"></button>
    </form>

    <h2 data-i18n="resultsHeading"></h2>

    <div id="results" aria-live="polite"></div>

    <script type="module" src="/scripts/scripts.js"></script>
</body>
</html>
